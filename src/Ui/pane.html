<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
:root{--bg:#1c1c1c;--card:#252525;--field:#2e2e2e;--edge:#3a3a3a;--text:#dcdcdc;--dim:#8c8c8c;--accent:#00c853;--amber:#e0a020;--red:#e14646;--blue:#5aa0ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:12.5px/1.45 -apple-system,"Segoe UI",Helvetica,sans-serif;-webkit-user-select:none;user-select:none}
header{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--edge)}
header b{font-size:13px;flex:1}
section{padding:10px 12px;border-bottom:1px solid var(--edge)}
h3{margin:0 0 6px;font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--dim);text-transform:uppercase}
select,input,textarea,button{font:inherit;color:var(--text);background:var(--field);border:1px solid var(--edge);border-radius:6px}
select{padding:3px 6px;max-width:150px}
button.icon{padding:3px 7px}
input{width:100%;padding:5px 8px}
textarea{width:100%;padding:7px 8px;resize:vertical;min-height:54px;-webkit-user-select:text;user-select:text}
button{padding:4px 10px;cursor:pointer}
button:hover{border-color:#555}
button.go{border-color:var(--accent);color:var(--accent)}
button.stop{border-color:var(--amber);color:var(--amber)}
.row{display:flex;gap:6px;align-items:center;margin-top:6px}
.grow{flex:1}
.title{font-size:14px;font-weight:600}
.pill{border:1px solid var(--accent);color:var(--accent);border-radius:99px;padding:0 7px;font-size:10px;font-weight:600}
.dim{color:var(--dim)}
.ok{color:var(--accent)}.warn{color:var(--amber)}.err{color:var(--red)}
.status{margin:3px 0 6px}
.error{background:rgba(225,70,70,.12);border:1px solid rgba(225,70,70,.4);color:#f09090;border-radius:6px;padding:6px 8px;margin:6px 0;white-space:pre-wrap;-webkit-user-select:text;user-select:text}
.entry{border-top:1px solid var(--edge);padding:6px 0}
.entry:first-child{border-top:0}
.req{white-space:pre-wrap}
.notes{color:var(--dim);font-size:11px;margin:2px 0 0 10px}
.inputs div{display:flex;justify-content:space-between;gap:8px;padding:1px 0}
.inputs span:last-child{color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:60%}
pre{background:#161616;border:1px solid var(--edge);border-radius:6px;padding:8px;max-height:260px;overflow:auto;font:11px/1.4 Menlo,Consolas,monospace;-webkit-user-select:text;user-select:text;white-space:pre}
details summary{cursor:pointer;color:var(--dim);margin-top:8px}
.lib{cursor:pointer;padding:5px 6px;border-radius:6px}
.lib:hover{background:var(--card)}
.lib .d{color:var(--dim);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.group{margin:8px 0 2px}
.hist{display:flex;justify-content:space-between;align-items:center;padding:2px 0}
.empty{color:var(--dim);padding:4px 0}
</style>
</head>
<body>
<header>
  <b>Alien</b>
  <select id="model" title="Model for describe-a-node"></select>
  <button id="settings" class="icon" title="Settings file (API key, models)">⚙</button>
  <button id="dock" class="icon" title="Dock in Rhino">⇲</button>
  <button id="close" class="icon" title="Close the panel">✕</button>
</header>

<section id="nodeSection">
  <div id="nodeHead"></div>
  <textarea id="prompt" placeholder="Describe a node…"></textarea>
  <div class="row">
    <select id="lang" title="Language for a new node"><option value="python">Python</option><option value="csharp">C#</option></select>
    <span class="grow dim" id="hint">Enter to send · Shift+Enter for a new line</span>
    <button id="stop" class="stop" style="display:none">Stop</button>
    <button id="send" class="go">Describe</button>
  </div>
  <div id="nodeBody"></div>
</section>

<section>
  <h3>Library</h3>
  <input id="search" placeholder="Search nodes">
  <div id="library"></div>
  <div class="row"><button id="newNode" class="grow">+ New blank node</button></div>
</section>

<script>
const $ = id => document.getElementById(id);
const post = (type, data) => window.eto.postMessage(JSON.stringify(Object.assign({ type }, data || {})));
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let state = { node: null, library: [], settings: {} };
let shownNode = null;

window.alien = {
  state(s) {
    const prevId = state.node && state.node.id;
    state = s;
    renderSettings();
    renderNode(prevId !== (s.node && s.node.id));
    renderLibrary();
  }
};

function renderSettings() {
  const inRhino = state.host === 'rhino';
  $('dock').textContent = inRhino ? '⇱' : '⇲';
  $('dock').title = inRhino ? 'Attach to the Grasshopper window' : 'Dock in Rhino';
  const sel = $('model'), st = state.settings || {};
  const models = st.models || [];
  if (sel.dataset.sig !== JSON.stringify(models) + st.model) {
    sel.innerHTML = models.map(m => `<option ${m === st.model ? 'selected' : ''}>${esc(m)}</option>`).join('')
      + (models.includes(st.model) ? '' : `<option selected>${esc(st.model)}</option>`);
    sel.dataset.sig = JSON.stringify(models) + st.model;
  }
}

function statusClass(n) { return n.describing ? 'warn' : n.level === 'error' ? 'err' : n.level === 'warning' ? 'warn' : n.level === 'ok' ? 'ok' : 'dim'; }

function renderNode(switched) {
  const n = state.node;
  $('lang').style.display = n && n.script ? 'none' : '';
  $('prompt').placeholder = n && n.script ? `Describe a change to ${n.name}…` : n ? 'Describe this node…' : 'Describe a new node…';
  $('send').style.display = n && n.describing ? 'none' : '';
  $('stop').style.display = n && n.describing ? '' : 'none';
  if (!n) {
    $('nodeHead').innerHTML = `<div class="dim" style="margin-bottom:6px">No Alien node selected. Describe a new one, place one from the library, or select a node on the canvas.</div>`;
    $('nodeBody').innerHTML = '';
    return;
  }
  $('nodeHead').innerHTML = `
    <div class="row" style="margin:0"><span class="title grow">${esc(n.name)}</span>${n.lang ? `<span class="pill">${esc(n.lang)}</span>` : ''}</div>
    <div class="status ${statusClass(n)}">${esc(n.describing ? n.activity || 'working…' : n.status)}</div>
    ${n.description ? `<div class="dim" style="margin-bottom:6px">${esc(n.description)}</div>` : ''}
    ${n.error ? `<div class="error">${esc(n.error)}</div>` : ''}`;

  const t = (n.transcript || []).slice().reverse();
  const inputs = (n.inputs || []).map(i => `<div><span>${esc(i.name)}</span><span>${esc(i.value)}</span></div>`).join('');
  const hist = (n.history || []).map(h => `<div class="hist"><span class="dim">${esc(h.when)}</span><button data-restore="${esc(h.file)}">Restore</button></div>`).join('');
  const open = id => (document.getElementById(id) || {}).open ? 'open' : '';
  $('nodeBody').innerHTML = `
    <h3 style="margin-top:12px">Requests</h3>
    ${t.length ? t.map(e => `<div class="entry"><div class="req">› ${esc(e.request)}</div>
      <div class="${e.state === 'ok' ? 'ok' : e.state === 'running' ? 'warn' : 'err'}">${esc(e.summary)}</div>
      ${e.notes && e.notes.length > 1 || (e.notes && e.notes.length && e.state !== 'ok') ? `<div class="notes">${e.notes.map(esc).join('<br>')}</div>` : ''}</div>`).join('')
      : '<div class="empty">None yet. Describe a change above.</div>'}
    ${inputs ? `<details id="dInputs" ${open('dInputs')}><summary>Inputs</summary><div class="inputs">${inputs}</div></details>` : ''}
    ${n.script ? `<details id="dCode" ${open('dCode')}><summary>Code</summary><pre>${esc(n.code)}</pre>
      <div class="row"><button data-act="openCode">Open in editor</button><button data-act="reveal">Show file</button></div></details>` : ''}
    ${hist ? `<details id="dHist" ${open('dHist')}><summary>Earlier versions (${n.history.length})</summary>${hist}</details>` : ''}`;
}

function renderLibrary() {
  const q = $('search').value.trim().toLowerCase();
  const items = (state.library || []).filter(i => !q || (i.name + ' ' + i.description).toLowerCase().includes(q));
  const groups = [['suite', 'Suite'], ['yours', 'Your nodes']];
  const html = groups.map(([key, label]) => {
    const rows = items.filter(i => i.group === key);
    if (!rows.length) return '';
    return `<h3 class="group">${label}</h3>` + rows.map(i =>
      `<div class="lib" data-place="${esc(i.path)}" title="Place on the canvas"><div>${esc(i.name)} <span class="dim">${esc(i.lang)}</span></div><div class="d">${esc(i.description || '')}</div></div>`).join('');
  }).join('');
  const lib = $('library');
  if (lib.dataset.html !== html) { lib.innerHTML = html || '<div class="empty">No nodes match.</div>'; lib.dataset.html = html; }
}

function send() {
  const text = $('prompt').value.trim();
  if (!text) return;
  post('describe', { text, lang: $('lang').value });
  $('prompt').value = '';
}

$('prompt').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
$('send').onclick = send;
$('stop').onclick = () => post('stop');
$('settings').onclick = () => post('settings');
$('dock').onclick = () => post('dock', { where: state.host === 'rhino' ? 'grasshopper' : 'rhino' });
$('close').onclick = () => post('close');
$('model').onchange = e => post('model', { value: e.target.value });
$('search').oninput = renderLibrary;
$('newNode').onclick = () => post('new', { lang: $('lang').value });
document.body.addEventListener('click', e => {
  const t = e.target.closest('[data-place],[data-restore],[data-act]');
  if (!t) return;
  if (t.dataset.place) post('place', { path: t.dataset.place });
  else if (t.dataset.restore) post('restore', { file: t.dataset.restore });
  else post(t.dataset.act);
});
post('ready');
</script>
</body>
</html>
